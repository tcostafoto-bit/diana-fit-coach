<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Diana Fit Coach</title>
<meta name="description" content="A tua app de treino: escolhe onde vais treinar e o tipo de treino, e o resto está feito.">
<meta name="theme-color" content="#133D26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diana Fit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/nosleep/0.12.0/NoSleep.min.js" defer></script>
<style>
:root{
  --paper:#EDF0EA; --paper2:#DDE3DA; --surface:#F8FAF6; --ink:#111A15; --muted:#56615A; --line:#CDD5CC;
  --green:#1E5A38; --green-deep:#133D26; --mint:#9FD2B0; --chalk:#EEF1E8; --sage:#6E8F7A;
  --night:#0E1712; --night2:#16211A; --night3:#1B2A21; --nline:#26342B; --nline2:#3A4A40; --nmuted:#9DAAA1; --nsoft:#C6D3CA;
  --amber:#E2B266; --mot:#C8843A;
  --display:"Big Shoulders Display","Arial Narrow",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sans:"Instrument Sans",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.dark button:focus-visible{outline-color:var(--mint)}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.disp{font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:.92;letter-spacing:.01em;text-wrap:balance}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}
.sub{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.35}
.dark .sub{color:var(--nmuted)}

/* figure */
.fig{display:block;width:100%;height:auto;stroke-linecap:round;stroke-linejoin:round;fill:none}
.light .fig,.fig.light{--fb:#111A15;--fp:#8A968E;--fa:#1E5A38}
.dark .fig{--fb:#EEF1E8;--fp:#3A4A40;--fa:#9FD2B0}
.fig .B{stroke:var(--fb);stroke-width:2.6}
.fig .P{stroke:var(--fp);stroke-width:1.8}
.fig .A{stroke:var(--fa);stroke-width:2.4}
.fig .Af{fill:var(--fa);stroke:none}
.fig .M{stroke:var(--mot);stroke-width:1.8;stroke-dasharray:3 4;marker-end:url(#dfcArr)}

/* home */
.top{display:flex;justify-content:space-between;align-items:baseline;padding-top:env(safe-area-inset-top,0px)}
.step-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 8px}
.step-h h2{margin:0;font-family:var(--display);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.step-h .eyebrow{color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:var(--paper2);border-radius:14px}
.seg button{min-height:60px;border:none;border-radius:11px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px}
.seg button b{font-size:13px;font-weight:700;line-height:1.1;text-align:center}
.seg button span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--chalk)}
.seg button[aria-pressed="true"] span{color:#B9C4BC}
.note{font-size:13px;line-height:1.45;color:var(--muted);margin:8px 4px 0}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tcard{min-height:92px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;padding:12px 12px 10px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.tcard .nm{font-family:var(--display);font-size:21px;font-weight:800;text-transform:uppercase;line-height:.95;letter-spacing:.01em}
.tcard .fo{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard .mt{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.tcard .mt b{color:var(--green);font-weight:600}
.tcard[aria-pressed="true"]{background:var(--ink);color:var(--chalk);border-color:var(--ink)}
.tcard[aria-pressed="true"] .fo,.tcard[aria-pressed="true"] .mt{color:#B9C4BC}
.tcard[aria-pressed="true"] .mt b{color:var(--mint)}
.tcard.sug{border-color:var(--green)}
.hero{position:relative;margin-top:12px;border-radius:22px;background:var(--green-deep);color:var(--chalk);padding:22px 20px 20px;display:flex;flex-direction:column;gap:18px;overflow:hidden}
.hero .bg{position:absolute;right:-60px;top:-50px;width:360px;opacity:.14;pointer-events:none}
.hero>*{position:relative}
.hero .t{font-size:44px}
.hero .meta{font-size:14px;color:#C6D3CA;margin-top:6px}
.dur{display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(0,0,0,.25);align-self:flex-start}
.dur button{min-height:40px;padding:0 14px;border:none;border-radius:9px;background:transparent;color:#C6D3CA;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.dur button span{font-family:var(--mono);font-size:10px;font-weight:500;opacity:.8}
.dur button[aria-pressed="true"]{background:var(--chalk);color:var(--ink)}
.dur button[aria-pressed="true"] span{opacity:.7}
.holes{display:flex;align-items:flex-end;gap:6px}
.holes .bars{flex-grow:1;display:flex;gap:3px;min-width:0}
.holes .s{flex-basis:0;display:flex;flex-direction:column;gap:7px;min-width:0}
.holes .s i{display:block;height:6px;border-radius:3px}
.holes .s b{font-family:var(--mono);font-size:10px;font-weight:600;white-space:nowrap}
.holes .s span{display:block;font-size:11px;color:#A9B8AE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{height:56px;border-radius:14px;border:none;background:var(--chalk);color:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:16px;font-weight:700;width:100%}
.exrows{display:flex;flex-direction:column;margin-top:4px}
.exrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 0;border-top:1px solid rgba(255,255,255,.1);font-size:13px}
.exrow .c{font-family:var(--display);font-size:15px;font-weight:800;color:var(--mint)}
.exrow .n{color:var(--chalk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exrow .n small{display:block;font-size:11px;color:#A9B8AE;font-style:italic}
.exrow .v{font-family:var(--mono);font-size:11px;color:#C6D3CA;white-space:nowrap}
.exhead{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#A9B8AE;padding:10px 0 2px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 2px 6px}
.sec-h h2{margin:0;font-family:var(--display);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.wlist{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:baseline;text-align:left;background:none;border:none;border-top:1px solid var(--line);padding:13px 2px;min-height:56px}
.wrow .n{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted)}
.wrow .tt{font-size:15px;font-weight:600}
.wrow .tags{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.wrow .mn{font-family:var(--mono);font-size:12px;color:var(--muted)}
.rules{margin-top:18px;display:flex;flex-direction:column;gap:9px;padding:16px;border-radius:18px;background:var(--ink);color:var(--chalk)}
.rules .r{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;font-size:13px;line-height:1.45}
.rules .r .eyebrow{font-size:10px;color:var(--mint);letter-spacing:.08em;padding-top:2px}
.rules b{color:#fff}
.data{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.data button,.data label{min-height:40px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.data .st{font-family:var(--mono);font-size:10.5px;color:var(--muted);flex-basis:100%}
.lastlog{margin:12px 4px 0;font-size:12.5px;color:var(--muted);line-height:1.4}
.lastlog b{color:var(--ink)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(237,240,234,.96);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(8px)}
.tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tabbar button{min-height:52px;border:none;background:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--ink);background:var(--paper2)}

/* library */
.search{width:100%;margin-top:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;font-family:var(--sans)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--chalk)}
.lgroup{margin-top:22px}
.lrow{width:100%;display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:none;border:none;border-top:1px solid var(--line);padding:9px 2px;min-height:58px}
.thumb{width:58px;height:44px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb .fig{width:56px}
.thumb.none{font-family:var(--mono);font-size:9.5px;color:var(--muted);text-align:center;line-height:1.2;padding:2px}
.lrow .nm{font-size:14px;font-weight:600;line-height:1.3}
.lrow .en{font-size:12px;color:var(--muted)}
.lrow .mu{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}

/* workout */
.wk{position:fixed;inset:0;z-index:20;background:var(--night);color:var(--chalk);overflow-y:auto;-webkit-overflow-scrolling:touch}
.wk .wrap{padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.wk-h{display:flex;align-items:center;gap:10px}
.ib{width:44px;height:44px;border-radius:12px;border:none;background:var(--night2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.clock{border:none;background:none;text-align:right;padding:0;display:flex;flex-direction:column;align-items:flex-end;min-height:44px;justify-content:center}
.clock b{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em}
.clock span{font-family:var(--mono);font-size:10px;color:var(--nmuted)}
.clock.paused b{color:var(--amber)}
.tools{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tool{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 11px;border-radius:18px;border:1px solid var(--nline2);background:transparent;font-family:var(--mono);font-size:11px;color:var(--nmuted)}
.tool.on{border-color:var(--mint);color:var(--mint)}
.track{position:relative;height:24px;margin-top:10px;display:flex;align-items:center;gap:3px;padding-right:18px}
.track i{display:block;height:4px;border-radius:2px;flex-basis:0}
.track .dot{position:absolute;top:7px;width:10px;height:10px;border-radius:50%;background:var(--chalk);border:2px solid var(--night);margin-left:-5px}
.track svg{position:absolute;right:0;top:1px}
.blk{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:10px}
.card{margin-top:10px;border-radius:20px;background:var(--night2);padding:16px;display:flex;flex-direction:column;gap:14px}
.ex-top{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:12px;align-items:start}
.code{font-family:var(--display);font-size:44px;font-weight:800;line-height:.85;color:var(--mint)}
.ex-name{font-size:28px;margin-top:6px}
.ex-en{font-size:13px;color:var(--nmuted);margin-top:5px}
.ex-where{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--mint);letter-spacing:.03em;text-transform:uppercase;line-height:1.45}
.ex-how{font-size:13.5px;line-height:1.45;color:var(--nsoft);text-wrap:pretty}
.ex-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:12px;color:var(--nsoft)}
.ex-meta .sep{color:var(--nline2)}
.tech{align-self:flex-start;min-height:40px;padding:0 14px;border-radius:11px;border:1px solid var(--nline2);background:transparent;font-size:13px;font-weight:600;color:var(--chalk);display:flex;align-items:center;gap:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.endbtn{margin:22px auto 0;display:flex;justify-content:center;width:100%;min-height:48px;border-color:#5A3F22;color:var(--amber)}
.endbox{margin-top:22px;padding:14px;border-radius:16px;border:1px solid #5A3F22;background:rgba(226,178,102,.06);display:flex;flex-direction:column;gap:10px}
.endbox p{margin:0;font-size:14px;line-height:1.45;color:var(--nsoft)}
.lg-sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lg-s{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:8px;background:var(--paper2)}
.lg-s.no{background:none;border:1px dashed var(--line);color:var(--muted)}
.kg-wrap{display:flex;align-items:center;gap:4px}
.kg-in{width:64px;height:44px;border-radius:10px;border:1px solid var(--nline2);background:var(--night);color:var(--chalk);font-family:var(--mono);font-size:17px;font-weight:600;text-align:center;padding:0 4px}
.kg-in:focus{outline:2px solid var(--mint);outline-offset:1px;border-color:var(--mint)}
.kg-u{font-family:var(--mono);font-size:12px;color:var(--nmuted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.side-hint{font-size:13px;line-height:1.4;color:var(--amber);padding:9px 12px;border-radius:12px;background:rgba(226,178,102,.08);border:1px solid rgba(226,178,102,.25)}
.ssb{gap:12px}
.sp{border-radius:16px;border:1px solid var(--nline);padding:12px;display:flex;flex-direction:column;gap:10px;opacity:.72}
.sp.on{opacity:1;border:1.5px solid var(--mint);background:#132019}
.sp-top{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:10px;align-items:start}
.sp-id{display:flex;align-items:center;gap:8px}
.sp-code{font-family:var(--display);font-size:30px;font-weight:800;line-height:.9;color:var(--nmuted)}
.sp.on .sp-code{color:var(--mint)}
.sp-tag{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:10px;background:var(--nline);color:var(--nsoft)}
.sp-tag.now{background:var(--mint);color:var(--night)}
.sp-name{font-size:21px;margin-top:6px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.sp .set .l{white-space:nowrap}
.sp .kg{min-width:58px;font-size:15px}
.sp .set.cur{gap:8px;padding-left:10px}
.pill{font-family:var(--mono);font-size:11.5px;padding:5px 10px;border-radius:9px;border:1px dashed var(--nline2);color:var(--nmuted)}
.pill.ok{border:1px solid transparent;background:var(--night3);color:var(--mint)}
.ss{margin:-2px 0 2px;padding:12px;border-radius:14px;background:#0F1C15;border:1px solid #2E3B32;display:flex;flex-direction:column;gap:10px}
.ss-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ss-tg{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--nline2);background:none;font-size:12px;font-weight:600;color:var(--chalk)}
.ss-seq{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ss-chip{display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:0 10px;border-radius:9px;background:var(--nline);font-size:12.5px;color:var(--nsoft)}
.ss-chip b{font-family:var(--display);font-size:15px;font-weight:800;color:var(--nmuted)}
.ss-chip.cur{background:var(--mint);color:var(--night)}
.ss-chip.cur b{color:var(--night)}
.ss-chip.ok{background:var(--night3);color:var(--mint)}
.ss-chip.ok b{color:var(--mint)}
.ss-rest{font-family:var(--mono);font-size:11px;color:var(--amber)}
.ss-note{margin:0;font-size:12.5px;line-height:1.4;color:var(--nmuted)}
.lhead{display:flex;justify-content:space-between;gap:8px;margin-top:12px;padding:6px 2px 4px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--nmuted)}
.lhead span:last-child{text-transform:none;letter-spacing:0;font-weight:500;color:#6E7D73}
.tech.skip{background:var(--mint);border-color:var(--mint);color:var(--night)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{min-height:46px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:12px;font-size:14px}
.set.done{background:var(--night3);border:none;width:100%;text-align:left;color:var(--chalk);font-family:inherit}
.set.done .v{color:var(--nsoft)}
.set.pend{border:1px dashed var(--nline2);background:none;width:100%;text-align:left;color:var(--chalk);font-family:inherit}
.set.pend .l{color:var(--nmuted)}
.set.pend .v{color:#6E7D73}
.set.cur{min-height:58px;border:1.5px solid var(--mint);padding-right:6px;font-weight:700}
.set .l{flex-grow:1}
.set .v{font-family:var(--mono);font-size:13px}
.ring-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--mint);flex-shrink:0}
.set.pend .ring-dot{border:1.5px solid var(--nline2)}
.step{width:44px;height:44px;border-radius:10px;border:none;background:var(--nline);font-size:20px;color:var(--chalk)}
.kg{min-width:70px;text-align:center;font-family:var(--mono);font-size:16px;font-weight:600}
.hold{min-height:44px;padding:0 14px;border-radius:10px;border:none;background:var(--nline);font-family:var(--mono);font-size:13px;font-weight:600;color:var(--chalk)}
.rest{display:flex;align-items:center;gap:16px;padding:4px 0}
.rest svg{flex-shrink:0}
.rest .info{display:flex;flex-direction:column;gap:6px;min-width:0}
.rest .info p{margin:0;font-size:14px;line-height:1.4;color:var(--nsoft)}
.rest .info strong{color:var(--chalk)}
.next{margin-top:18px}
.nrow{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:46px;border:none;border-top:1px solid #1F2B24;background:none;text-align:left;padding:0 2px}
.nrow .c{font-family:var(--display);font-size:18px;font-weight:800;color:#6E7D73}
.nrow .nm{font-size:14px;color:var(--nsoft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow .v{font-family:var(--mono);font-size:11.5px;color:var(--nmuted);white-space:nowrap}
.nrow.on{background:var(--night2);border-radius:10px;border-top-color:transparent;padding:0 8px}
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--night);border-top:1px solid #1F2B24;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bbar .in{max-width:480px;margin:0 auto;display:flex;gap:8px}
.presets{display:flex;gap:2px;padding:4px;border-radius:14px;background:var(--night2)}
.presets button{width:40px;min-height:48px;border:none;border-radius:10px;background:transparent;font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--nsoft)}
.main-btn{flex-grow:1;min-height:56px;border-radius:14px;border:none;background:var(--mint);color:var(--night);font-size:16px;font-weight:700}
.main-btn.alt{background:var(--amber)}
.finish{margin-top:14px;border-radius:20px;background:var(--night2);padding:22px 18px;display:flex;flex-direction:column;gap:12px}

/* WOD */
.wod-kind{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wod-timer{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px}
.wod-timer .big{font-family:var(--mono);font-size:56px;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--chalk)}
.wod-timer .big.warn{color:var(--amber)}
.wod-timer .lbl{font-family:var(--mono);font-size:11px;color:var(--nmuted);letter-spacing:.08em;text-transform:uppercase}
.wod-phase{font-family:var(--display);font-size:30px;font-weight:800;text-transform:uppercase;color:var(--mint);line-height:1}
.wod-phase.rest{color:var(--amber)}
.wod-bar{height:6px;border-radius:3px;background:var(--nline);overflow:hidden}
.wod-bar i{display:block;height:100%;background:var(--mint);border-radius:3px}
.wod-bar.rest i{background:var(--amber)}
.wod-list{display:flex;flex-direction:column;gap:4px}
.wod-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:52px;padding:6px 10px;border-radius:12px;border:1px solid var(--nline);text-align:left;background:none;color:var(--chalk);font-family:inherit}
.wod-row.on{border:1.5px solid var(--mint);background:#132019}
.wod-row .th{width:40px;height:32px}
.wod-row .th .fig{width:40px}
.wod-row .nm{font-size:14px;font-weight:600;line-height:1.2}
.wod-row .nm small{display:block;font-size:11px;font-weight:400;color:var(--nmuted)}
.wod-row .rp{font-family:var(--mono);font-size:12.5px;color:var(--mint);white-space:nowrap}
.rounds{display:flex;align-items:center;justify-content:center;gap:14px}
.rounds .rn{font-family:var(--display);font-size:52px;font-weight:800;line-height:1;min-width:64px;text-align:center}
.rounds .rl{font-family:var(--mono);font-size:10px;color:var(--nmuted);letter-spacing:.08em;text-transform:uppercase;text-align:center}
.rounds .step{width:52px;height:52px;font-size:26px;border-radius:14px}
.wod-note{margin:0;font-size:13px;line-height:1.45;color:var(--nsoft)}

/* editor */
.tcard.new{border:1.5px dashed var(--green);background:transparent}
.tcard.new .nm{color:var(--green)}
.ed-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.ed-row{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ed-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ed-n b{display:block;font-size:14px;line-height:1.25}
.ed-n small{display:block;font-size:11.5px;color:var(--muted)}
.ed-btns{display:flex;gap:4px;flex-shrink:0}
.ib.sm{width:34px;height:34px;border-radius:9px;background:var(--paper2);font-size:15px;font-weight:700}
.ib.sm.del{color:#8A5520}
.ed-ctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.ed-ctl label{display:flex;flex-direction:column;gap:3px;min-width:0}
.ed-ctl label span{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ed-ctl select,.ed-ctl input{min-height:40px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:13px;padding:0 8px;width:100%;min-width:0}
.ed-opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ed-res{max-height:46vh;overflow-y:auto;border-top:1px solid var(--line);margin-top:6px}
.ed-save{position:sticky;bottom:-24px;background:var(--paper);padding:12px 0 8px;margin-top:12px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--line)}
.ed-save .main-btn{min-height:50px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(14,23,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .pan{width:100%;max-width:480px;max-height:92vh;overflow-y:auto;background:var(--paper);border-radius:22px 22px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .grab{display:flex;justify-content:space-between;align-items:center}
.sheet .illo{margin-top:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);padding:8px 10px}
.sheet .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.tile{padding:10px 12px;border-radius:14px;background:var(--paper2);display:flex;flex-direction:column;gap:2px;min-width:0}
.tile:first-child{background:var(--ink);color:var(--chalk)}
.tile span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.tile:first-child span{color:var(--nmuted)}
.tile b{font-family:var(--display);font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowsx{margin-top:10px}
.rx{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.rx .eyebrow{font-size:10.5px;letter-spacing:.08em;color:var(--muted);padding-top:2px}
.rx.feel .eyebrow{color:var(--green)}
.rx.avoid .eyebrow{color:#8A5520}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--chalk);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}

@media (prefers-reduced-motion: no-preference){
  .sheet .pan{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>

    ["Adutora (Máquina)","perna","Almofadas do lado de dentro dos joelhos. Fecha as pernas apertando o interior das coxas, segura 1s e abre devagar até onde controlas.","Sentada na adutora, almofadas por dentro dos joelhos"],
    ["Chest Press (Máquina)","peito","Pegas à altura do meio do peito, costas no encosto. Empurra até quase esticar sem bloquear os cotovelos e volta devagar até sentir o peito a abrir. Ombros para baixo.","Sentada na chest press, pegas à frente"],
    ["Shoulder Press (Máquina)","ombros","Pegas à altura das orelhas, costas no encosto. Empurra para cima sem arquear a lombar e desce devagar até às orelhas.","Sentada na shoulder press, pegas ao lado da cabeça"],
    ["Lat Pulldown (Polia)","costas","Pega mais larga que os ombros, coxas presas. Puxa a barra ao topo do peito levando os cotovelos para baixo e para trás, sobe controlado até esticar os braços.","Sentada na máquina de puxada, coxas presas por baixo dos rolos"],
    ["Remada Sentada (Polia)","costas","Pés nos apoios, joelhos ligeiramente fletidos, tronco direito. Puxa a pega ao umbigo juntando as omoplatas, segura 1s e volta sem arredondar as costas.","Sentada na máquina de remada, pés nos apoios"],
    ["Remada c/ Apoio ao Peito (Máquina)","costas","Peito apoiado na almofada, puxa as pegas para trás com os cotovelos junto ao corpo, junta as omoplatas e volta devagar. O tronco não sai da almofada.","Sentada na máquina, peito apoiado na almofada"],
    ["Pull-Up (Barra)","costas","Pega em pronação, um pouco mais larga que os ombros. Puxa até o queixo passar a barra levando os cotovelos para baixo, desce controlado até esticar. Se não fizeres as reps todas, usa a máquina assistida ou um elástico.","Pendurada na barra fixa"],
    ["Pull-Up Assistido (Máquina ou Elástico)","costas","Joelhos na plataforma (ou elástico por baixo dos pés). Puxa até o queixo passar a barra e desce controlado. Quanto menos ajuda, mais difícil.","Máquina de pull-up assistido ou elástico na barra"],
    ["Face Pull (Polia)","ombros","Corda na polia alta, recua um passo. Puxa na direção da testa com os cotovelos altos e abre as mãos no fim. Leve e controlado.","De pé, recuada da polia alta, corda nas mãos"],
    ["Tríceps na Polia (Corda)","tricep","Cotovelos colados às costelas. Estica os braços para baixo e abre a corda no fim, aperta o tríceps 1s. Só o antebraço mexe.","De pé de frente para a polia alta, corda"],
    ["Rosca Bíceps na Polia","bicep","Cotovelos junto ao corpo, sobe a barra ao peito sem balançar e desce devagar — a polia mantém tensão o tempo todo.","De pé de frente para a polia baixa, barra"],
    ["Kickback de Glúteo (Polia)","gluteo","Tornozeleira no pé, mãos apoiadas na torre. Leva a perna para trás com o joelho quase esticado e aperta o glúteo no fim, sem arquear a lombar.","De pé de frente para a polia baixa, tornozeleira"],
    ["Abdução de Anca (Polia)","gluteo","Tornozeleira na perna de fora, leva a perna para o lado sem inclinar o tronco e volta devagar.","De pé de lado para a polia baixa, tornozeleira"],
    ["Pull-Through (Polia)","gluteo","De costas para a polia baixa, corda entre as pernas. Dobra a anca para trás com as costas retas e volta apertando o glúteo — é um hinge com cabo.","De costas para a polia baixa, corda entre as pernas"],
    ["Pallof Press (Polia)","core","Pega à altura do peito, de lado para a polia. Estica os braços à frente e aguenta 2s sem deixar o tronco rodar. Volta e repete.","De pé de lado para a polia a meia altura"],
    ["Crunch na Polia (Corda)","core","De joelhos, corda junto à cabeça. Enrola o tronco para baixo levando os cotovelos às coxas — é o abdómen que puxa, a anca fica parada.","De joelhos de frente para a polia alta, corda"],
    ["Crossover (Polia)","peito","Pegas nas polias altas, um passo à frente. Traz as mãos à frente do peito em arco, aperta 1s e abre devagar.","De pé entre as duas polias altas"],
    ["Elevação Lateral (Polia)","ombros","Polia baixa do lado oposto ao braço. Eleva o braço de lado até à linha do ombro sem encolher o trapézio, desce devagar.","De pé de lado para a polia baixa"],
    ["Woodchop (Polia)","core","Pega com as duas mãos junto ao ombro, roda anca e tronco juntos e puxa em diagonal até à anca oposta. A força vem da rotação, não dos braços.","De pé de lado para a polia alta"]
  ]},
  {g:"Cardio · Fitness Up", items:[
    ["Passadeira – Aquecimento","cardio","Caminhada rápida ou corrida leve, ritmo em que consegues falar. Só para aquecer.","Passadeira"],
    ["Passadeira – Intervalos","cardio","Alterna 30s rápido (esforço 8–9) com 30s a andar. Repete até ao tempo indicado. Sobe a velocidade quando os 30s rápidos parecerem fáceis.","Passadeira"],
    ["Passadeira – Inclinada","cardio","Inclinação 10–15%, caminhada rápida sem te agarrares. Esforço 6–7, ritmo constante.","Passadeira inclinada"],
    ["Remo – Aquecimento","cardio","Ritmo leve, foco na sequência pernas → tronco → braços na puxada e o inverso na volta.","Máquina de remo"],
    ["Remo – Intervalos","cardio","30s forte (esforço 8–9) / 30s leve. Empurra com as pernas primeiro, os braços só terminam o movimento.","Máquina de remo"],
    ["Escada – Contínuo","cardio","Ritmo constante, esforço 6–7, sem te apoiares nos corrimões. Passo completo em cada degrau.","Escada rolante (stair climber)"],
    ["Escada – Intervalos","cardio","1 min forte / 1 min leve. Nos minutos fortes, dois degraus de cada vez se conseguires.","Escada rolante (stair climber)"],
    ["Elíptica – Contínuo","cardio","Ritmo constante, esforço 5–6, resistência média. Bom para recuperar sem impacto.","Elíptica"]
  ]},
  {g:"Halteres · Fitness Up", items:[
    ["Elevação Lateral (Halteres)","ombros","Halteres ao lado do corpo, cotovelos ligeiramente fletidos. Eleva os braços de lado até à linha dos ombros sem encolher o trapézio e desce devagar.","De pé, halteres nas mãos"]
  ]},
  {g:"Funcional", items:[
    ["Kettlebell Swing","gluteo","Pés um pouco mais largos que a anca, kettlebell entre as pernas. Dobra a anca para trás (não é squat), deixa o KB passar entre as coxas e estica a anca com força até o KB chegar à altura do peito. Braços soltos, é a anca que manda.","De pé, kettlebell no chão à frente"],
    ["Thruster (Halteres)","perna/ombros","Halteres nos ombros, desce em squat completo e, ao subir, usa o impulso para empurrar os halteres acima da cabeça. Um movimento só, sem pausa em cima.","De pé, halteres nos ombros"],
    ["Box Jump","perna","Pés à largura da anca, salta para cima da caixa e aterra suave com os joelhos dobrados. Desce a pé (não saltes para baixo).","De pé de frente para a caixa"],
    ["Wall Ball","perna/ombros","Bola ao peito, squat completo e ao subir lança a bola ao alvo na parede. Apanha e desce logo em squat. Ritmo constante.","De pé de frente para a parede, bola medicinal"],
    ["Farmer's Carry (Halteres)","core","Halteres pesados nas mãos, ombros para trás e para baixo, caminha o tempo ou distância indicados sem inclinar para nenhum lado.","De pé, halteres ao lado do corpo"],
    ["Renegade Row (Halteres)","costas/core","Em prancha alta com as mãos nos halteres, pés afastados. Puxa um halter ao lado do corpo sem rodar a anca, pousa e troca.","Em prancha alta, mãos nos halteres"],
    ["Afundo com Salto","perna","Em afundo, salta e troca de perna no ar, aterra em afundo do outro lado. Tronco direito, joelho da frente por cima do pé.","De pé, espaço livre"],
    ["Elevação de Joelhos na Barra","core","Pendurada na barra, sobe os joelhos ao peito enrolando a bacia e desce controlado, sem balançar.","Pendurada na barra fixa"],
    ["Sit-Up","core","Deitada, joelhos dobrados. Sobe o tronco todo até sentar tocando com as mãos nos pés e desce controlado.","Deitada de costas, joelhos dobrados"]
  ]},
  {g:"Sem ginásio", items:[
    ["Agachamento (Peso Corporal)","perna","Pés à largura dos ombros, desce a anca para trás e para baixo até as coxas ficarem paralelas ao chão, sobe empurrando o chão. Peso no meio do pé.","De pé, espaço livre"],
    ["Agachamento Tempo 3-1-1","perna","Desce em 3 segundos, para 1 segundo no fundo e sobe em 1. O tempo lento substitui a carga.","De pé, espaço livre"],
    ["Agachamento Sumo c/ Elástico","perna/gluteo","Pés largos e pontas para fora, elástico comprido debaixo dos pés e nos ombros (ou mini band nos joelhos). Desce empurrando os joelhos para fora e sobe apertando o glúteo.","De pé, pernas afastadas, elástico"],
    ["Split Squat (Peso Corporal)","perna","Um pé à frente, outro atrás. Desce a direito até o joelho de trás quase tocar o chão e sobe. Faz as reps todas de um lado e troca.","De pé, um pé à frente do outro"],
    ["Afundo Inverso","perna","Dá um passo grande para trás e desce até o joelho de trás quase tocar o chão, volta à posição inicial empurrando com a perna da frente. Alterna.","De pé, espaço livre"],
    ["Afundo Búlgaro (Cadeira)","perna/gluteo","Pé de trás apoiado numa cadeira ou sofá, desce a perna da frente até 90° sem o joelho passar muito a ponta do pé.","De pé, pé de trás numa cadeira ou sofá"],
    ["RDL Unilateral (Peso Corporal)","perna/gluteo","Numa perna só, dobra a anca para a frente esticando a outra perna para trás até o tronco ficar quase paralelo ao chão. Volta apertando o glúteo. Podes segurar um objeto pesado.","De pé, numa perna só"],
    ["Bom Dia c/ Elástico","perna/gluteo","Elástico comprido debaixo dos pés e atrás do pescoço. Dobra a anca para trás com as costas retas e joelhos quase esticados, até sentir os posteriores, e sobe apertando o glúteo.","De pé, elástico debaixo dos pés e nos ombros"],
    ["Ponte Glúteos Unilateral","gluteo","Deitada, uma perna esticada no ar. Empurra a anca para cima com a outra perna, aperta o glúteo em cima e desce devagar.","Deitada de costas, um pé no chão"],
    ["Clamshell c/ Mini Band","gluteo","Deitada de lado, joelhos dobrados, mini band acima dos joelhos. Abre o joelho de cima como uma concha sem rodar a bacia, segura 1s e fecha devagar.","Deitada de lado, mini band nos joelhos"],
    ["Kickback de Glúteo c/ Mini Band","gluteo","De quatro apoios, mini band nos pés ou coxas. Estica uma perna para trás e para cima apertando o glúteo, sem arquear a lombar.","De quatro apoios, mini band"],
    ["Abdução de Anca Deitada","gluteo","Deitada de lado, perna de cima esticada. Sobe a perna até 45° com o pé a apontar em frente (não para cima), desce devagar. Mini band nos tornozelos para dificultar.","Deitada de lado, perna de cima esticada"],
    ["Hamstring Walkout","perna","Em ponte de glúteos, caminha com os calcanhares para a frente até quase esticar as pernas, mantendo a anca alta, e volta atrás.","Deitada de costas, ponte de glúteos"],
    ["Remada c/ Elástico","costas","Elástico comprido preso baixo (ou debaixo dos pés, sentada). Puxa as pegas ao umbigo juntando as omoplatas e volta devagar.","Sentada ou de pé, elástico preso à frente"],
    ["Puxada c/ Elástico (Porta)","costas","Elástico preso no topo da porta. De joelhos ou sentada, puxa as pegas até ao peito levando os cotovelos para baixo e para trás.","De joelhos de frente para a porta, elástico no topo"],
    ["Remada Invertida (Mesa)","costas","Deitada por baixo de uma mesa robusta, agarra a borda com os braços esticados e puxa o peito até à mesa, corpo reto. Pés mais perto = mais fácil.","Deitada por baixo de uma mesa robusta"],
    ["Pike Push-Up","ombros","Em V invertido, anca alta, mãos à largura dos ombros. Dobra os cotovelos para levar a cabeça ao chão à frente das mãos e empurra de volta. Trabalha os ombros.","No chão, em V invertido"],
    ["Press de Ombros c/ Elástico","ombros","Elástico debaixo dos pés, pegas nos ombros. Empurra para cima até esticar e desce devagar sem arquear a lombar.","De pé, elástico debaixo dos pés"],
    ["Elevação Lateral c/ Elástico","ombros","Elástico debaixo do pé, eleva os braços de lado até à linha dos ombros com os cotovelos ligeiramente fletidos e desce devagar.","De pé, elástico debaixo dos pés"],
    ["Rosca Bíceps c/ Elástico","bicep","Elástico debaixo dos pés, cotovelos fixos ao lado do corpo, sobe as pegas até aos ombros sem balançar.","De pé, elástico debaixo dos pés"],
    ["Extensão de Tríceps c/ Elástico","tricep","Elástico preso atrás (ou debaixo de um pé), pegas atrás da cabeça. Estica os braços para cima mantendo os cotovelos junto à cabeça.","De pé, elástico atrás da cabeça"],
    ["Dips (Cadeira)","tricep","Mãos numa cadeira robusta atrás do corpo, pernas esticadas à frente. Desce dobrando os cotovelos para trás e sobe empurrando.","Mãos na cadeira, corpo à frente"],
    ["Hollow Hold","core","Deitada de costas, lombar colada ao chão, braços e pernas esticados a uns centímetros do chão. Aguenta o tempo indicado sem a lombar descolar. Se for demais, dobra os joelhos.","Deitada de costas no tapete"],
    ["V-Up","core","Deitada esticada, sobe ao mesmo tempo o tronco e as pernas até as mãos tocarem os pés (forma um V) e desce controlado.","Deitada de costas no tapete"],
    ["Russian Twist","core","Sentada com o tronco inclinado para trás e os pés no ar (ou no chão para facilitar), roda o tronco tocando com as mãos no chão de cada lado.","Sentada no tapete, tronco inclinado"],
    ["Bicicleta (Abdominal)","core","Deitada, mãos atrás da cabeça. Traz o cotovelo ao joelho oposto enquanto esticas a outra perna, alternando com ritmo controlado.","Deitada de costas no tapete"],
    ["Superman","core","De barriga para baixo, braços à frente. Levanta ao mesmo tempo braços, peito e pernas do chão, aguenta 2s e desce.","Deitada de barriga para baixo no tapete"],
    ["Pallof Press (Elástico na Porta)","core","Elástico preso à porta à altura do peito, de lado. Estica os braços à frente e aguenta 2s sem deixar o tronco rodar. Volta e repete.","De pé de lado para a porta, elástico à altura do peito"],
    ["Polichinelos","cardio","Salta abrindo pernas e braços ao mesmo tempo, fecha e repete. Ritmo constante.","De pé, espaço livre"],
    ["Joelhos ao Peito","cardio","Corrida no lugar trazendo os joelhos à altura da anca, braços a acompanhar. Rápido.","De pé, espaço livre"],
    ["Skaters","cardio/perna","Salta de lado para um pé, o outro cruza atrás, e volta para o outro lado. Como patinar.","De pé, espaço livre"],
    ["Salto em Comprimento","perna","Dobra a anca e os joelhos, balança os braços e salta o mais longe possível para a frente. Aterra suave e caminha de volta.","De pé, espaço livre à frente"],
    ["Corda de Saltar","cardio","Saltos pequenos e rápidos, pulsos a rodar a corda. Sem corda, faz o mesmo movimento a simular.","De pé, espaço livre"],
    ["Squat to Press c/ Elástico","perna/ombros","Elástico debaixo dos pés, pegas nos ombros. Squat completo e, ao subir, empurra as pegas acima da cabeça num movimento só.","De pé, elástico debaixo dos pés"],
    ["Marcha no Lugar","cardio","Marcha rápida no lugar, joelhos altos, braços a balançar. Só para aquecer.","De pé"],
    ["Corrida no Lugar","cardio","Corrida no lugar, ritmo rápido, calcanhares ao glúteo ou joelhos altos alternados.","De pé"],
    ["Alongamento Quadricípite (De Pé)","mobilidade","De pé, puxa o calcanhar ao glúteo com a mão do mesmo lado, joelhos juntos e anca à frente. Apoia-te se precisares.","De pé, numa perna"],
    ["Alongamento Peitoral (Porta)","mobilidade","Antebraço no aro da porta, roda o corpo para o lado oposto até sentir o peito a abrir.","De pé, antebraço no aro da porta"],
    ["Alongamento Dorsais (Mesa)","mobilidade","Mãos na borda de uma mesa, recua a anca e deixa o tronco cair entre os braços até sentir as costas laterais a abrir.","De pé, mãos apoiadas numa mesa"],
    ["Postura da Criança","mobilidade","De joelhos, senta nos calcanhares e estica os braços à frente no chão, testa no tapete. Respira fundo para as costas.","No tapete, de joelhos"],
    ["Alongamento Posteriores (Sentada)","mobilidade","Sentada com uma perna esticada, inclina o tronco à frente com as costas direitas até sentir atrás da coxa.","Sentada no tapete"],
    ["Pigeon","mobilidade","Uma perna dobrada à frente com a canela no chão, a outra esticada atrás. Deixa a anca descer e o tronco cair à frente. Sente o glúteo.","No tapete, uma perna dobrada à frente"],
    ["Alongamento Gémeos (Parede)","mobilidade","Mãos na parede, uma perna atrás esticada com o calcanhar no chão. Avança a anca até sentir a barriga da perna.","De pé, mãos na parede"],
    ["Alongamento Tríceps e Ombro","mobilidade","Braço acima da cabeça, cotovelo dobrado com a mão nas costas. Com a outra mão puxa o cotovelo suavemente.","De pé ou sentada"]
  ]}
);

var HERO_BG = '<svg class="bg" viewBox="0 0 360 300" fill="none" aria-hidden="true"><g stroke="#EEF1E8" stroke-width="1.2"><circle cx="230" cy="130" r="110"/><circle cx="230" cy="130" r="84"/><circle cx="230" cy="130" r="58"/><circle cx="230" cy="130" r="32"/><path d="M40 260c60-40 140-30 200 10M10 300c80-50 180-40 250 0"/></g></svg>';

function todayLabel(){
  var d = new Date(), wd = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"], mo = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  return wd[d.getDay()] + " · " + d.getDate() + " " + mo[d.getMonth()];
}
function fmtDate(iso){ return iso.split("-").reverse().slice(0, 2).join("/"); }
function daysAgo(iso){ var d = new Date(iso + "T12:00:00"), n = Math.round((Date.now() - d.getTime()) / 86400000); return n <= 0 ? "hoje" : (n === 1 ? "ontem" : "há " + n + " dias"); }
function lastOfType(k){ var l = null; (st.log || []).forEach(function(x){ if (x.type === k) l = x; }); return l; }
function suggestedType(){
  var best = null, bestAge = -1;
  ["legs","glutes","upper","push","pull","full"].forEach(function(k){
    var l = lastOfType(k), age = l ? (Date.now() - new Date(l.date + "T12:00:00").getTime()) : 1e15;
    if (age > bestAge){ bestAge = age; best = k; }
  });
  return best;
}
function keyExercises(day){
  var names = [];
  day.blocks.forEach(function(b){
    if (/^Aquec|^Along|Arref/.test(b.name)) return;
    b.items.forEach(function(it){ var n = enShort(it[0]); if (names.indexOf(n) < 0) names.push(n); });
  });
  return names.slice(0, 3).join(" · ") + (names.length > 3 ? " …" : "");
}
function previewRows(day){
  var h = '<div class="exrows">';
  day.blocks.forEach(function(b, bi){
    h += '<div class="exhead">' + esc(b.name) + (isWod(b) ? ' · ' + esc(wodTitle(b)) : '') + ' · ' + b.min + '′</div>';
    b.items.forEach(function(it, ii){
      var kg = curKg(it);
      h += '<div class="exrow"><span class="c">' + codeOf(day, bi, ii) + '</span><span class="n">' + esc(enName(it[0])) + (ptName(it[0]) ? '<small>' + esc(ptName(it[0])) + '</small>' : '') + '</span><span class="v">' + esc(it[1]) + (kg != null ? ' · ' + fmtKg(kg) + ' ' + unitOf(it) : '') + '</span></div>';
    });
  });
  return h + '</div>';
}

function renderHome(){
  if (!typeOf(st.type)) st.type = "legs";
  var day = curDay(), t = typeOf(st.type);
  var h = '<div class="wrap">';
  h += '<div class="top"><span class="eyebrow">Diana Fit Coach</span><span class="mono" style="font-size:11px;color:var(--muted)">' + esc(todayLabel()) + '</span></div>';

  h += '<div class="step-h"><h2>Onde vais treinar?</h2><span class="eyebrow">Passo 1</span></div>';
  h += '<div class="seg" role="group" aria-label="Local de treino">';
  LOC_ORDER.forEach(function(k){
    h += '<button data-loc="' + k + '" aria-pressed="' + (st.loc === k) + '"><b>' + esc(LOCS[k].name) + '</b><span>' + esc(LOCS[k].sub) + '</span></button>';
  });
  h += '</div><p class="note">' + esc(LOCS[st.loc].note) + '. O treino adapta-se ao que há neste sítio.</p>';

  var sug = suggestedType();
  h += '<div class="step-h"><h2>Que treino queres?</h2><span class="eyebrow">Passo 2</span></div>';
  h += '<div class="tgrid" role="group" aria-label="Tipo de treino">';
  TYPE_ORDER.forEach(function(k){
    var tt = TYPES[k], l = lastOfType(k), d = resolveDay(k, curVer(k), st.loc, st.dur);
    h += '<button class="tcard' + (k === sug && k !== st.type ? ' sug' : '') + '" data-type="' + k + '" aria-pressed="' + (st.type === k) + '"><span><span class="nm">' + esc(tt.name) + '</span><div class="fo">' + esc(keyExercises(d)) + '</div></span><span class="mt"><span>' + (l ? esc(daysAgo(l.date)) : (k === sug ? '<b>sugestão</b>' : 'nunca')) + '</span><span>' + d.min + '′</span></span></button>';
  });
  h += '</div>';
  var cids = Object.keys(st.custom || {});
  h += '<div class="step-h"><h2>Os teus treinos</h2><span class="eyebrow">criados por ti</span></div><div class="tgrid">';
  cids.forEach(function(id){
    var k = "custom:" + id, c = st.custom[id], l = lastOfType(k), d = resolveDay(k, 0, st.loc, st.dur);
    h += '<button class="tcard" data-type="' + k + '" aria-pressed="' + (st.type === k) + '"><span><span class="nm">' + esc(c.name || "O meu treino") + '</span><div class="fo">' + esc(keyExercises(d) || "sem exercícios") + '</div></span><span class="mt"><span>' + (l ? esc(daysAgo(l.date)) : (c.items || []).length + ' exerc.') + '</span><span>' + d.min + '′</span></span></button>';
  });
  h += '<button class="tcard new" id="newCustom"><span><span class="nm">+ Criar treino</span><div class="fo">Escolhe os exercícios, séries e esforço</div></span><span class="mt"><span>o teu</span></span></button>';
  h += '</div>';

  var inProg = st.sess && !st.sess.finished;
  h += '<div class="hero">' + HERO_BG;
  h += '<div><div class="eyebrow" style="color:var(--mint)">' + esc(LOCS[st.loc].name) + ' · versão ' + day.verLabel + '</div>';
  h += '<div class="disp t" style="margin-top:6px">' + esc(day.title) + '</div>';
  h += '<div class="meta">' + day.min + ' min · ' + countItems(day) + ' exercícios · esforço até ' + effortMax(day) + '/10</div>' + (t.custom ? '<button class="tech" id="editCustom" style="margin-top:10px;border-color:rgba(255,255,255,.3);color:var(--chalk)">Editar este treino</button>' : '') + '</div>';
  if (!day.noDuration){
    var dl = resolveDay(st.type, curVer(st.type), st.loc, "long"), ds = resolveDay(st.type, curVer(st.type), st.loc, "short");
    h += '<div class="dur" role="group" aria-label="Duração"><button data-dur="short" aria-pressed="' + (st.dur === "short") + '">Curto<span>' + ds.min + ' min</span></button><button data-dur="long" aria-pressed="' + (st.dur === "long") + '">Longo<span>' + dl.min + ' min</span></button></div>';
  }
  h += '<div class="holes"><div class="bars">';
  day.blocks.forEach(function(b){
    h += '<div class="s" style="flex-grow:' + b.min + '"><i style="background:' + blockColor(b) + '"></i><div><b>' + b.min + '′</b><br><span>' + esc(blockLabel(b)) + '</span></div></div>';
  });
  h += '</div></div>';
  if (inProg){
    var sd = sessDay();
    h += '<button class="go" id="goBtn"><span>Continuar · ' + esc(sd.title) + ' · ' + mmss(elapsed()) + '</span>' + ARROW + '</button>';
    h += '<button class="tech" id="dropBtn" style="align-self:center;border-color:rgba(255,255,255,.3);color:#C6D3CA">Descartar o treino a meio</button>';
  } else {
    h += '<button class="go" id="goBtn"><span>Começar treino</span>' + ARROW + '</button>';
  }
  h += '<details open><summary class="eyebrow" style="color:#A9B8AE;cursor:pointer;list-style:none">Ver os exercícios ▾</summary>' + previewRows(day) + '</details>';
  h += '</div>';

  var lg = (st.log || []).slice(-1)[0];
  if (lg) h += '<p class="lastlog">Último treino: <b>' + esc(lg.title) + '</b> · ' + esc(LOCS[lg.loc] ? LOCS[lg.loc].name : "") + ' · ' + lg.done + '/' + lg.total + ' séries · ' + Math.round(lg.sec / 60) + ' min' + (lg.partial ? ' · terminado mais cedo' : '') + ' · ' + esc(fmtDate(lg.date)) + '</p>';
  var logs = (st.log || []).slice(-12).reverse();
  if (logs.length){
    h += '<div class="sec-h"><h2>Histórico</h2><span class="mono" style="font-size:11px;color:var(--muted)">' + st.log.length + ' treinos</span></div><div class="wlist">';
    logs.forEach(function(l, i){
      h += '<button class="wrow" data-log="' + ((st.log.length - 1) - i) + '"><span class="n">' + esc(fmtDate(l.date)) + '</span><span><span class="tt">' + esc(l.title) + ' · ' + esc(l.ver || "") + '</span><div class="tags">' + esc(LOCS[l.loc] ? LOCS[l.loc].name : "") + ' · ' + l.done + '/' + l.total + ' séries' + (l.partial ? ' · terminado mais cedo' : '') + '</div></span><span class="mn">' + Math.round(l.sec / 60) + '′</span></button>';
    });
    h += '</div>';
  }
  h += '<div class="rules"><div class="r"><span class="eyebrow">Superséries</span><span>A1 → 30s → A2 → 60s → repete. A app troca sozinha entre os dois.</span></div>';
  h += '<div class="r"><span class="eyebrow">Progressão</span><span>Séries todas feitas com esforço igual ou abaixo do indicado → <b>+2,5 kg</b> na barra e máquinas, <b>+1 kg</b> nos halteres. O peso é editável série a série e fica guardado.</span></div>';
  h += '<div class="r"><span class="eyebrow">Versões</span><span>Cada tipo tem 3 versões (A, B, C) que rodam sozinhas de cada vez que terminas um treino.</span></div>';
  h += '<div class="r"><span class="eyebrow">Esforço</span><span>1 quase nada · 5 sobra muito · 8 sobram 2 reps · 10 falha</span></div></div>';
  h += '<div class="data"><button id="expBtn">Exportar cópia</button><button id="impBtn">Importar cópia</button><span class="st">Os dados ficam só neste telemóvel. Exporta de vez em quando e manda o ficheiro ao Tiago.</span></div>';
  h += '</div>';
  var el = document.getElementById("home");
  el.innerHTML = h;
  el.querySelectorAll("[data-loc]").forEach(function(b){ b.addEventListener("click", function(){ st.loc = b.getAttribute("data-loc"); save(); renderHome(); toast("Treinos adaptados a " + LOCS[st.loc].name); }); });
  el.querySelectorAll("[data-type]").forEach(function(b){ b.addEventListener("click", function(){ st.type = b.getAttribute("data-type"); save(); renderHome(); var hero = el.querySelector(".hero"); if (hero) hero.scrollIntoView({behavior:"smooth", block:"start"}); }); });
  el.querySelectorAll("[data-dur]").forEach(function(b){ b.addEventListener("click", function(){ st.dur = b.getAttribute("data-dur"); save(); renderHome(); }); });
  document.getElementById("goBtn").addEventListener("click", function(){ unlockAudio(); startOrResume(); });
  var db = document.getElementById("dropBtn"); if (db) db.addEventListener("click", function(){ st.sess = null; ui.rest = null; save(); renderHome(); toast("Treino descartado"); });
  el.querySelectorAll("[data-log]").forEach(function(b){ b.addEventListener("click", function(){ openLog(parseInt(b.getAttribute("data-log"), 10)); }); });
  document.getElementById("expBtn").addEventListener("click", exportData);
  document.getElementById("newCustom").addEventListener("click", function(){ openEditor(null); });
  var ec = document.getElementById("editCustom"); if (ec) ec.addEventListener("click", function(){ openEditor(st.type.slice(7)); });
  document.getElementById("impBtn").addEventListener("click", function(){ document.getElementById("importFile").click(); });
}
document.getElementById("importFile").addEventListener("change", function(e){ var f = e.target.files && e.target.files[0]; if (f) importData(f); e.target.value = ""; });

/* ---------- LIBRARY ---------- */
var GSHORT = {"Home Gym 900":"Home Gym","Power Rack 900":"Rack","Banco Ajustável":"Banco","Halteres + Barra":"Barra / halteres","Halteres Fixos":"Halteres","Bicicleta Estática":"Bike","Elásticos de Resistência":"Elástico","Peso Corporal":"Corpo","Alongamentos":"Along.","Máquinas · Fitness Up":"Máquina","Cardio · Fitness Up":"Cardio","Funcional":"Funcional","Sem ginásio":"Casa"};
var MUSCLES = ["peito","costas","ombros","bicep","tricep","perna","gluteo","core","cardio","mobilidade"];
function renderLib(){
  var q = ui.search.trim().toLowerCase(), loc = ui.libLoc || st.loc;
  var h = '<div class="wrap"><div class="top"><span class="eyebrow">Biblioteca</span><span class="mono" style="font-size:11px;color:var(--muted)">' + Object.keys(EX).length + ' exercícios</span></div>';
  h += '<div class="disp" style="font-size:40px;margin-top:10px">Como se faz</div>';
  h += '<label for="libSearch" class="eyebrow" style="position:absolute;left:-9999px">Procurar</label><input id="libSearch" class="search" type="search" placeholder="Procurar em inglês ou português" value="' + esc(ui.search) + '">';
  h += '<div class="chips" role="group" aria-label="Local">';
  LOC_ORDER.forEach(function(k){ h += '<button class="chip" data-lloc="' + k + '" aria-pressed="' + (loc === k) + '">' + esc(LOCS[k].name) + '</button>'; });
  h += '</div><div class="chips" role="group" aria-label="Grupo muscular">';
  MUSCLES.forEach(function(mu){ h += '<button class="chip" data-mu="' + mu + '" aria-pressed="' + (ui.filter === mu) + '">' + mu + '</button>'; });
  h += '</div><div id="libList">';
  var any = false;
  LIB.forEach(function(g){
    var gl = GROUP_LOC[g.g] || LOC_ORDER;
    if (!q && gl.indexOf(loc) < 0) return;
    var rows = g.items.filter(function(it){
      var en = (EX_EN[it[0]] || "").toLowerCase();
      return (!ui.filter || it[1].indexOf(ui.filter) !== -1) && (!q || it[0].toLowerCase().indexOf(q) !== -1 || en.indexOf(q) !== -1);
    });
    if (!rows.length) return; any = true;
    h += '<div class="lgroup"><div class="eyebrow" style="color:var(--muted);margin-bottom:6px">' + esc(g.g) + ' · ' + rows.length + '</div>';
    rows.forEach(function(it){
      var f = fig(it[0], "light");
      h += '<button class="lrow" data-ex="' + esc(it[0]) + '">' + (f ? '<span class="thumb">' + f + '</span>' : '<span class="thumb none">' + esc(GSHORT[g.g] || g.g) + '</span>') + '<span><div class="nm">' + esc(enName(it[0])) + '</div><div class="en">' + esc(ptName(it[0])) + ' <span class="mu">· ' + esc(it[1]) + '</span></div></span></button>';
    });
    h += '</div>';
  });
  if (!any) h += '<p class="empty">Nenhum exercício com esse nome.</p>';
  h += '</div></div>';
  var el = document.getElementById("lib");
  el.innerHTML = h;
  var inp = document.getElementById("libSearch");
  inp.addEventListener("input", function(){
    ui.search = inp.value; var pos = inp.selectionStart; renderLib();
    var n = document.getElementById("libSearch"); n.focus(); try { n.setSelectionRange(pos, pos); } catch(e){}
  });
  el.querySelectorAll("[data-lloc]").forEach(function(b){ b.addEventListener("click", function(){ ui.libLoc = b.getAttribute("data-lloc"); renderLib(); }); });
  el.querySelectorAll("[data-mu]").forEach(function(b){ b.addEventListener("click", function(){ var v = b.getAttribute("data-mu"); ui.filter = ui.filter === v ? null : v; renderLib(); }); });
  el.querySelectorAll("[data-ex]").forEach(function(b){ b.addEventListener("click", function(){ openSheet(b.getAttribute("data-ex"), null); }); });
}

/* ---------- SHEET ---------- */
var CLOSE_BTN = '<button class="ib" id="sheetClose" aria-label="Fechar" style="background:var(--paper2)"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14" stroke="#111A15" stroke-width="2" stroke-linecap="round"/></svg></button>';
function openSheet(name, ctx){
  var ex = EX[name] || look(EX, name) || {}, feel = look(FEEL, name);
  var f = fig(name, "light");
  var h = '<div class="pan light" role="dialog" aria-modal="true" aria-label="' + esc(enName(name)) + '">';
  h += '<div class="grab"><span class="eyebrow" style="color:var(--muted)">' + esc(ctx ? ctx.code + " · " + ctx.block : (ex.g || "")) + '</span>' + CLOSE_BTN + '</div>';
  h += '<div class="disp" style="font-size:38px;margin-top:6px">' + esc(enName(name)) + '</div>';
  h += '<div style="font-size:14px;color:var(--muted);margin-top:6px">' + esc(ptName(name)) + '</div>';
  if (f) h += '<div class="illo">' + f + '</div>';
  if (ctx){
    var kg = curKg(ctx.it);
    h += '<div class="tiles"><div class="tile"><span>SÉRIES</span><b>' + esc(ctx.it[1]) + '</b></div><div class="tile"><span>PESO</span><b>' + (kg != null ? fmtKg(kg) + " kg" : "—") + '</b></div><div class="tile"><span>ESFORÇO</span><b>' + (ctx.it[2] || "—") + '/10</b></div></div>';
  }
  h += '<div class="rowsx">';
  if (ex.setup) h += '<div class="rx"><span class="eyebrow">Onde</span><span>' + esc(ex.setup) + '</span></div>';
  if (ex.howto) h += '<div class="rx"><span class="eyebrow">Como</span><span>' + esc(ex.howto) + '</span></div>';
  if (feel){
    h += '<div class="rx feel"><span class="eyebrow">Sentir</span><span>' + esc(feel[0]) + '</span></div>';
    h += '<div class="rx avoid"><span class="eyebrow">Evitar</span><span>' + esc(feel[1]) + '</span></div>';
  }
  h += '</div></div>';
  showSheet(h);
}
function showSheet(h){
  var el = document.getElementById("sheet");
  el.innerHTML = h; el.hidden = false;
  var closer = document.getElementById("sheetClose");
  closer.addEventListener("click", closeSheet); closer.focus();
  el.onclick = function(e){ if (e.target === el) closeSheet(); };
}
function openLog(i){
  var l = (st.log || [])[i]; if (!l) return;
  var h = '<div class="pan light" role="dialog" aria-modal="true" aria-label="Treino de ' + esc(l.date) + '">';
  h += '<div class="grab"><span class="eyebrow" style="color:var(--muted)">' + esc(l.date.split("-").reverse().join("/")) + ' · ' + esc(LOCS[l.loc] ? LOCS[l.loc].name : "") + '</span>' + CLOSE_BTN + '</div>';
  h += '<div class="disp" style="font-size:36px;margin-top:6px">' + esc(l.title) + ' · ' + esc(l.ver || "") + '</div>';
  h += '<p style="margin:6px 0 0;color:var(--muted);font-size:14px">' + l.done + '/' + l.total + ' séries · ' + Math.round(l.sec / 60) + ' min' + (l.partial ? ' · terminado mais cedo' : '') + (l.dur === "short" ? ' · versão curta' : '') + '</p><div class="rowsx">';
  (l.wod || []).forEach(function(w){
    h += '<div class="rx"><span class="eyebrow">' + esc(w.kind) + '</span><span><b style="font-weight:600">' + esc(w.name) + '</b><div class="lg-sets"><span class="lg-s">' + (w.rounds != null ? w.rounds + ' rondas' : '') + '</span><span class="lg-s">' + mmss(w.sec) + '</span></div></span></div>';
  });
  (l.ex || []).forEach(function(e){
    var cells = e.s.map(function(v){ return v === null ? '<span class="lg-s no">—</span>' : '<span class="lg-s">' + (v === true ? '✓' : fmtKg(v) + ' kg') + '</span>'; }).join("");
    h += '<div class="rx"><span class="eyebrow">' + esc(e.c) + '</span><span><b style="font-weight:600">' + esc(enName(e.n)) + '</b> <span style="color:var(--muted);font-size:12.5px">· ' + esc(e.r) + '</span><div class="lg-sets">' + cells + '</div></span></div>';
  });
  h += '</div></div>';
  showSheet(h);
}
/* ---------- EDITOR de treinos ---------- */
var ZONES = [["perna","Pernas"],["gluteo","Glúteos"],["costas","Costas"],["peito","Peito"],["ombros","Ombros"],["bicep","Bíceps"],["tricep","Tríceps"],["core","Core"],["cardio","Cardio"],["mobilidade","Alongar"]];
var SCHEMES = ["3×8","3×10","3×12","3×15","4×8","4×10","4×12","2×12","2×15","3×20","3×30s","3×45s","3×60s","3×10/lado","3×12/lado","3×30s/lado","1×10","1×15","1×3 min","1×5 min"];
function openEditor(id){
  var c = id && st.custom[id] ? JSON.parse(JSON.stringify(st.custom[id])) : {name:"", items:[], ss:true, rest:60, warm:true, stretch:true};
  ui.ed = {id:id || ("c" + Date.now().toString(36)), isNew:!id, c:c, q:"", zone:null, loc:st.loc, free:{}, confirmDel:false};
  renderEditor();
}
function edSearchRows(){
  var ed = ui.ed, q = ed.q.trim().toLowerCase(), rows = [];
  LIB.forEach(function(g){
    var gl = GROUP_LOC[g.g] || LOC_ORDER;
    if (!q && gl.indexOf(ed.loc) < 0) return;
    g.items.forEach(function(it){
      var en = (EX_EN[it[0]] || "").toLowerCase();
      if (ed.zone && it[1].indexOf(ed.zone) < 0) return;
      if (!q || it[0].toLowerCase().indexOf(q) !== -1 || en.indexOf(q) !== -1 || it[1].indexOf(q) !== -1) rows.push(it);
    });
  });
  return rows.slice(0, q ? 40 : 200);
}
function renderEditor(){
  var ed = ui.ed, c = ed.c;
  var h = '<div class="pan light" role="dialog" aria-modal="true" aria-label="Criar treino">';
  h += '<div class="grab"><span class="eyebrow" style="color:var(--muted)">' + (ed.isNew ? "Novo treino" : "Editar treino") + '</span>' + CLOSE_BTN + '</div>';
  h += '<label class="eyebrow" style="display:block;margin-top:12px;color:var(--muted)">Nome do treino</label><input id="edName" class="search" style="margin-top:6px" type="text" placeholder="ex.: Pernas da Diana" value="' + esc(c.name) + '">';
  h += '<div class="eyebrow" style="margin-top:16px;color:var(--muted)">Exercícios · ' + c.items.length + '</div><div class="ed-list">';
  if (!c.items.length) h += '<p class="note" style="margin:8px 0">Ainda não há exercícios. Procura em baixo e toca para adicionar.</p>';
  c.items.forEach(function(it, i){
    var isTime = /s\b|min/.test(it[1] || "");
    h += '<div class="ed-row"><div class="ed-top"><span class="ed-n"><b>' + esc(enName(it[0])) + '</b><small>' + esc(ptName(it[0])) + '</small></span><span class="ed-btns"><button class="ib sm" data-up="' + i + '" aria-label="Subir">↑</button><button class="ib sm" data-down="' + i + '" aria-label="Descer">↓</button><button class="ib sm del" data-del="' + i + '" aria-label="Remover">✕</button></span></div>';
    h += '<div class="ed-ctl"><label><span>Séries × reps / tempo</span>';
    if (ed.free[i]) h += '<input type="text" data-schfree="' + i + '" placeholder="ex.: 3×12 ou 2×40s" value="' + esc(it[1]) + '">';
    else {
      h += '<select data-sch="' + i + '">';
      var list = SCHEMES.slice(); if (list.indexOf(it[1]) < 0) list.unshift(it[1]);
      list.forEach(function(sc){ h += '<option value="' + esc(sc) + '"' + (sc === it[1] ? ' selected' : '') + '>' + esc(sc) + '</option>'; });
      h += '<option value="__free">Escrever…</option></select>';

function ssBlockCard(day, x, blk, restHtml, setsHtml, extraActs){
  var r = parseRest(blk.rest), bi = x.bi;
  var n0 = setsOf(blk.items[0]), n1 = setsOf(blk.items[1]);
  var d0 = doneOf(bi, 0, n0), d1 = doneOf(bi, 1, n1), rounds = Math.max(n0, n1);
  var round = Math.min(rounds, Math.min(d0, d1) + 1);

  h += '<p class="ss-note">' + codeOf(day, bi, 0) + ' → ' + r.between + 's → ' + codeOf(day, bi, 1) + ' → ' + r.after + 's → repete. Uma série de cada, sempre a alternar.</p>';
  h += restHtml;
  [0, 1].forEach(function(ii){
    var it = blk.items[ii], n = setsOf(it), d = doneOf(bi, ii, n), on = ii === x.ii, kg = curKg(it);
    var tag = on ? "Agora" : (d >= n ? "Feito" : "A seguir");
    h += '<div class="sp' + (on ? ' on' : '') + '">';
    h += '<div class="sp-top"><div style="min-width:0"><div class="sp-id"><span class="sp-code">' + codeOf(day, bi, ii) + '</span><span class="sp-tag' + (on ? ' now' : '') + '">' + tag + '</span></div>';
    h += '<div class="disp sp-name">' + esc(enName(it[0])) + '</div><div class="ex-en">' + esc(ptName(it[0])) + '</div></div><div class="sp-fig">' + fig(it[0]) + '</div></div>';
    h += '<div class="ex-meta"><span>' + esc(it[1]) + '</span><span class="sep">|</span><span>esforço ' + (it[2] || "—") + '/10</span>' + (kg != null ? '<span class="sep">|</span><span>' + fmtKg(kg) + ' ' + unitOf(it) + '</span>' : '') + '</div>';
    var sh2 = sideHint(it); if (sh2 && on) h += '<div class="side-hint">' + esc(sh2) + '</div>';
    if (on) h += setsHtml;
    else {
      h += '<div class="pills">';
      for (var k = 0; k < n; k++){ var dd = st.sess.done[bi + "." + ii + "." + k]; h += '<span class="pill' + (dd ? ' ok' : '') + '">S' + (k + 1) + (dd ? ' ✓' : '') + '</span>'; }

    h += '</div>';
  });

}
function ssBanner(day, x, blk, alt){

  var h = '<div class="ss">';
  if (alt){
    var round = Math.min(rounds, Math.min(d0, d1) + 1);
    h += '<div class="ss-top"><span class="eyebrow" style="color:var(--amber)">Supersérie · ronda ' + round + ' de ' + rounds + '</span><button class="ss-tg" id="ssToggle">Fazer um de cada vez</button></div>';
    h += '<div class="ss-seq">';
    [0, 1].forEach(function(ii){
      var dn = ii === 0 ? d0 : d1, doneRound = dn >= round, cur = x.ii === ii;
      var cls = cur ? "cur" : (doneRound ? "ok" : "");
      h += '<span class="ss-chip ' + cls + '"><b>' + codeOf(day, bi, ii) + '</b> ' + esc(enShort(blk.items[ii][0])) + (doneRound && !cur ? ' ✓' : '') + '</span>';
      h += '<span class="ss-rest">' + (ii === 0 ? r.between + 's' : r.after + 's ↺') + '</span>';
    });
    h += '</div><p class="ss-note">Alternas entre os dois: fazes uma série de cada, descansas ' + r.after + 's e repetes. A app troca sozinha.</p>';
  } else {
    h += '<div class="ss-top"><span class="eyebrow" style="color:var(--nmuted)">Um de cada vez</span><button class="ss-tg" id="ssToggle">Voltar a alternar (supersérie)</button></div>';
    h += '<div class="ss-seq"><span class="ss-chip ' + (x.ii === 0 ? "cur" : (d0 >= n0 ? "ok" : "")) + '"><b>' + codeOf(day, bi, 0) + '</b> × ' + n0 + '</span><span class="ss-rest">depois</span><span class="ss-chip ' + (x.ii === 1 ? "cur" : (d1 >= n1 ? "ok" : "")) + '"><b>' + codeOf(day, bi, 1) + '</b> × ' + n1 + '</span><span class="ss-rest">' + r.after + 's entre séries</span></div>';
  }
  return h + '</div>';
}
function endEarly(){
  var s = st.sess; if (!s) return;
  s.finished = true; s.partial = true; s.endSec = elapsed(); s.accum = s.endSec * 1000; s.running = false;
  ui.rest = null; ui.confirmEnd = false; save(); renderWorkout();
  try { document.getElementById("wk").scrollTo(0, 0); } catch(e){}
}
function logSession(){
  var s = st.sess, day = sessDay(), total = 0;
  allItems(day).forEach(function(y){ total += y.n; });
  var ex = [], wods = [];
  allItems(day).forEach(function(y){
    var sets = [], nm = y.it[0];
    for (var k = 0; k < y.n; k++){ var d = s.done[y.bi + "." + y.ii + "." + k]; sets.push(d ? (d.kg != null ? d.kg : true) : null); if (d && d.n) nm = d.n; }
    ex.push({c:codeOf(day, y.bi, y.ii), n:nm, r:parseScheme(y.it[1]).reps, s:sets});
  });
  day.blocks.forEach(function(b, bi){
    if (!isWod(b)) return; var w = s.wod && s.wod[bi]; if (!w || !(w.finished || w.accum > 0)) return;
    wods.push({name:b.name + " · " + wodTitle(b), kind:wodLabel(b), rounds:(b.wod.kind === "amrap" || b.wod.kind === "fortime") ? w.rounds : null, sec:Math.round((w.sec != null ? w.sec : w.accum / 1000))});
  });
  var entry = {date:new Date().toISOString().slice(0,10), type:s.type, ver:day.verLabel, loc:s.loc, dur:s.dur, title:day.title, done:Object.keys(s.done).length, total:total, sec:Math.round(s.endSec || 0), partial:!!s.partial, ex:ex, wod:wods};
  (st.log = st.log || []).push(entry);
  if (st.log.length > 200) st.log = st.log.slice(-200);
}
function endHtml(doneSets, totalSets){
  if (ui.confirmEnd){
    return '<div class="endbox"><div class="eyebrow" style="color:var(--amber)">Terminar já?</div><p>Fizeste ' + doneSets + ' de ' + totalSets + ' séries. Fica registado só o que fizeste — o resto fica como não feito.</p><div class="acts"><button class="main-btn alt" id="endYes" style="flex-grow:1;min-height:48px">Sim, terminar</button><button class="tech" id="endNo">Continuar</button></div></div>';
  }
  return '<button class="tech endbtn" id="endAsk">Terminar treino agora</button>';
}
function exerciseList(day, x){
  var h = '<div class="next"><div class="eyebrow" style="font-size:10px;color:var(--nmuted);padding-bottom:4px">Exercícios do treino · toca para mudar</div>';
  var lastBi = -1;
  allItems(day).forEach(function(y){
    if (y.bi !== lastBi){
      lastBi = y.bi; var bk = day.blocks[y.bi];
      var sub = isWod(bk) ? wodTitle(bk) : (isSS(bk) ? (st.ssMode !== "seq" ? "alternar " + codeOf(day, y.bi, 0) + " ⇄ " + codeOf(day, y.bi, 1) : "um de cada vez") : bk.rest);
      h += '<div class="lhead"><span>' + esc(bk.name) + '</span><span>' + esc(sub) + '</span></div>';
    }
    var dn = doneOf(y.bi, y.ii, y.n), full = dn >= y.n, isCur = x && x.bi === y.bi && (x.ii === y.ii || isWod(day.blocks[y.bi]));
    var col = isCur ? "#9FD2B0" : (full ? "#4F6457" : "#9DAAA1");
    var stTxt = full ? "✓ feito" : (isWod(day.blocks[y.bi]) ? y.it[1] : dn + "/" + y.n);
    h += '<button class="nrow' + (isCur ? " on" : "") + '" data-focus="' + y.bi + '.' + y.ii + '"' + (isCur ? ' aria-current="step"' : '') + '><span class="c" style="color:' + col + '">' + codeOf(day, y.bi, y.ii) + '</span><span class="nm" style="' + (full && !isCur ? "color:#6E7D73;text-decoration:line-through;text-decoration-color:#3A4A40" : (isCur ? "color:#EEF1E8;font-weight:600" : "")) + '">' + esc(enName(y.it[0])) + '</span><span class="v" style="' + (full ? "color:#9FD2B0" : "") + '">' + esc(stTxt) + '</span></button>';
  });
  return h + '</div>';
}
function wireList(el){
  el.querySelectorAll("[data-focus]").forEach(function(b){
    b.addEventListener("click", function(){
      var p = b.getAttribute("data-focus").split("."), bi = +p[0], ii = +p[1];
      var day = sessDay(), it = itemAt(day, bi, ii), n = setsOf(it);
      if (doneOf(bi, ii, n) >= n){
        ui.viewDone = bi + "." + ii; ui.rest = null; st.sess.focus = {bi:bi, ii:ii}; save(); renderWorkout();
        try { document.getElementById("wk").scrollTo(0, 0); } catch(e){}
      } else setFocus(bi, ii);
    });
  });
}

function wireWorkoutCommon(){
  var sb2 = document.getElementById("soundBtn");
  if (sb2) sb2.addEventListener("click", function(){ st.sound = st.sound === true ? false : true; save(); if (st.sound) play("start"); renderWorkout(); });
  var wb = document.getElementById("wakeBtn");
  if (wb) wb.addEventListener("click", function(){
    if (st.keepAwake === false){ st.keepAwake = true; save(); wakeOn(); }
    else if (wake.on){ st.keepAwake = false; save(); wakeOff(); }
    else { wake.userTried = true; wakeOn(); }
  });
  paintWake();
  var lb = document.getElementById("locBtn"); if (lb) lb.addEventListener("click", function(){ ui.locPick = !ui.locPick; renderWorkout(); });
  document.querySelectorAll("[data-setloc]").forEach(function(b){ b.addEventListener("click", function(){ st.sess.loc = b.getAttribute("data-setloc"); st.loc = st.sess.loc; ui.locPick = false; ui.rest = null; save(); renderWorkout(); toast("Treino adaptado a " + LOCS[st.sess.loc].name); }); });
  document.getElementById("wkBack").addEventListener("click", function(){ ui.rest = null; ui.locPick = false; showWorkout(false); });
  document.getElementById("clockBtn").addEventListener("click", function(){
    var s = st.sess; if (!s || s.finished) return;
    if (s.running){ s.accum = elapsed() * 1000; s.running = false; } else { s.running = true; s.startedAt = Date.now(); }
    save(); renderWorkout();
  });
}

/* ---------- ticker ---------- */
setInterval(function(){
  if (document.getElementById("wk").hidden || !st.sess) return;
  var s = st.sess, day = sessDay(), total = day.min * 60, e = s.finished ? s.endSec : elapsed();
  var ct = document.getElementById("clockTxt"); if (ct) ct.textContent = mmss(e);
  var dot = document.getElementById("trackDot"); if (dot) dot.style.left = "calc(" + Math.min(100, e / total * 100).toFixed(1) + "% * (1 - 18 / 100))";
  var r = ui.rest;
  if (r){
    var left = Math.max(0, (r.end - Date.now()) / 1000);
    var arc = document.getElementById("ringArc"), tx = document.getElementById("ringTxt");
    if (arc) arc.setAttribute("stroke-dashoffset", (326.7 * (1 - left / r.total)).toFixed(1));
    if (tx) tx.textContent = left >= 60 ? mmss(left).replace(/^0/, "") : Math.ceil(left) + "s";
    var sec = Math.ceil(left);
    if (r.kind === "hold" && r.sides && !r.switched && left <= r.total / 2){ r.switched = true; play("go"); vib([150,80,150]); var inf = document.querySelector(".rest .info p"); if (inf) inf.textContent = "Troca de lado!"; }
    if (sec <= 3 && sec >= 1 && r.lastCount !== sec){ r.lastCount = sec; play("count"); }
    if (r.kind === "rest" && r.total >= 20 && sec === 10 && r.lastCount !== 10){ r.lastCount = 10; play("tick"); }
    if (left <= 0){
      beep();
      if (r.kind === "hold"){ ui.rest = null; markDone(); }
      else { ui.rest = null; renderWorkout(); }
    }
  }
  /* WOD em curso */
  if (!s.finished && s.focus && s.wod && s.wod[s.focus.bi] && s.wod[s.focus.bi].running){
    var bi = s.focus.bi, b = day.blocks[bi], w = s.wod[bi], info = wodInfo(b, w), k = b.wod.kind;
    if (info.over){ w.accum += Date.now() - w.startedAt; w.running = false; w.startedAt = null; w.accum = wodTotal(b) * 1000; play("green"); vib([300,100,300]); if (k === "amrap" || k === "emom" || k === "circuit") wodFinish(bi); else { save(); renderWorkout(); } return; }
    if (info.phase && w.lastPhase !== info.phase){ if (w.lastPhase != null){ play("go"); vib(info.work === false ? 80 : [120,60,120]); } w.lastPhase = info.phase; renderWorkout(); return; }
    var big = document.getElementById("wodBig"), bar = document.querySelector("#wodBar i");
    var txt, pct, warn;
    if (k === "amrap"){ txt = mmss(info.left); pct = info.el / info.total; warn = info.left <= 30; }
    else if (k === "emom"){ txt = Math.ceil(info.left) + "s"; pct = 1 - info.left / 60; warn = info.left <= 5; }
    else if (k === "fortime"){ txt = mmss(info.el); pct = info.el / info.total; warn = info.left <= 60; }
    else { txt = Math.ceil(info.left) + "s"; pct = info.work ? 1 - info.left / b.wod.work : 1 - info.left / b.wod.rest; warn = info.left <= 3; }
    if (big){ big.textContent = txt; big.className = "big" + (warn ? " warn" : ""); }
    if (bar) bar.style.width = (Math.min(1, pct) * 100).toFixed(1) + "%";
    var sec2 = Math.ceil(info.left);
    if (sec2 <= 3 && sec2 >= 1 && w.lastCount !== sec2 && k !== "fortime"){ w.lastCount = sec2; play("count"); }
  }
}, 250);

function setTab(t){
  ui.tab = t;
  document.getElementById("home").hidden = t !== "home";
  document.getElementById("lib").hidden = t !== "lib";
  document.getElementById("tabHome").setAttribute("aria-current", t === "home" ? "page" : "false");
  document.getElementById("tabLib").setAttribute("aria-current", t === "lib" ? "page" : "false");
  if (t === "lib") renderLib(); else renderHome();
  window.scrollTo(0, 0);
}
